name: pasarkita
description: "Marketplace Flutter Project PasarKita"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  appwrite: ^17.0.0

  cupertino_icons: ^1.0.8

  #koneksian ke firabase yang sudah tidak terpakai lagi
  # firebase_storage: ^12.3.3

  # State Management
  provider: ^6.1.2

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utility
  intl: ^0.19.0

  # PDF
  pdf: ^3.11.3
  printing: ^5.14.2

  # Persistence
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/aksesoris/
    - assets/images/pria/
    - assets/images/sepatu/
    - assets/images/tas/
    - assets/images/wanita/

  # Fonts (optional)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf